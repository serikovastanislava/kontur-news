services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kontur}
      POSTGRES_USER: ${POSTGRES_USER:-kontur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kontur_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kontur} -d ${POSTGRES_DB:-kontur}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Europe/Moscow}
      POSTGRES_DB: ${POSTGRES_DB:-kontur}
      POSTGRES_USER: ${POSTGRES_USER:-kontur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kontur_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/news/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  parser:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "manage.py", "parse_news", "--loop", "--interval", "60"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Europe/Moscow}
      POSTGRES_DB: ${POSTGRES_DB:-kontur}
      POSTGRES_USER: ${POSTGRES_USER:-kontur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kontur_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - staticfiles:/staticfiles:ro

volumes:
  postgres_data:
  staticfiles:
